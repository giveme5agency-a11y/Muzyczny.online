<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustracja: scena synthwave z małymi instrumentami dla dzieci">
  <defs>
    <linearGradient id="dz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080610"></stop>
      <stop offset="0.4" stop-color="#180f18"></stop>
      <stop offset="0.62" stop-color="#3a1a12"></stop>
      <stop offset="0.7" stop-color="#5a2a08"></stop>
    </linearGradient>
    <linearGradient id="dz-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4A0"></stop>
      <stop offset="0.4" stop-color="#FDB84A"></stop>
      <stop offset="1" stop-color="#F58F00"></stop>
    </linearGradient>
    <linearGradient id="dz-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1408"></stop>
      <stop offset="1" stop-color="#080304"></stop>
    </linearGradient>
    <radialGradient id="dz-glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#F58F00" stop-opacity="0.5"></stop>
      <stop offset="1" stop-color="#F58F00" stop-opacity="0"></stop>
    </radialGradient>
    <mask id="dz-sun-stripes">
      <rect width="1200" height="500" fill="white"></rect>
      <rect x="0" y="290" width="1200" height="3" fill="black"></rect>
      <rect x="0" y="298" width="1200" height="4" fill="black"></rect>
      <rect x="0" y="308" width="1200" height="5" fill="black"></rect>
      <rect x="0" y="320" width="1200" height="6" fill="black"></rect>
    </mask>
  </defs>

  <rect width="1200" height="310" fill="url(#dz-sky)"></rect>

  
