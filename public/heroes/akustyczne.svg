<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustracja: scena synthwave z gitarą akustyczną i górami">
  <defs>
    <linearGradient id="ak-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.4" stop-color="#1a0f12"/>
      <stop offset="0.62" stop-color="#3d1c08"/>
      <stop offset="0.7" stop-color="#5a2606"/>
    </linearGradient>
    <linearGradient id="ak-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4A0"/>
      <stop offset="0.4" stop-color="#FDB84A"/>
      <stop offset="1" stop-color="#F58F00"/>
    </linearGradient>
    <linearGradient id="ak-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1408"/>
      <stop offset="1" stop-color="#080304"/>
    </linearGradient>
    <radialGradient id="ak-glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#F58F00" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F58F00" stop-opacity="0"/>
    </radialGradient>
    <mask id="ak-sun-stripes">
      <rect width="1200" height="500" fill="white"/>
      <rect x="0" y="290" width="1200" height="3" fill="black"/>
      <rect x="0" y="298" width="1200" height="4" fill="black"/>
      <rect x="0" y="308" width="1200" height="5" fill="black"/>
      <rect x="0" y="320" width="1200" height="6" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="310" fill="url(#ak-sky)"/>

  <!-- Stars -->
  <g fill="#FDD478" opacity="0.75">
    <circle cx="90" cy="70" r="1"/>
    <circle cx="240" cy="45" r="1.3"/>
    <circle cx="380" cy="100" r="0.9"/>
    <circle cx="500" cy="60" r="1"/>
    <circle cx="700" cy="90" r="1.2"/>
    <circle cx="820" cy="50" r="0.9"/>
    <circle cx="960" cy="105" r="1"/>
    <circle cx="1120" cy="75" r="1.1"/>
    <circle cx="180" cy="150" r="0.6"/>
    <circle cx="620" cy="140" r="0.6"/>
    <circle cx="900" cy="160" r="0.6"/>
  </g>

  <!-- Glow -->
  <ellipse cx="600" cy="310" rx="550" ry="200" fill="url(#ak-glow)"/>

  <!-- Sun -->
  <g mask="url(#ak-sun-stripes)">
    <circle cx="600" cy="310" r="150" fill="url(#ak-sun)"/>
  </g>

  <!-- Distant mountain range - jagged peaks silhouetted against sun -->
  <path d="M0 310
           L80 250 L140 285 L200 220 L260 270 L310 195 L380 265 L440 210
           L500 275 L560 230 L600 200 L640 235 L700 275 L760 215 L820 265
           L890 195 L940 260 L1000 220 L1060 285 L1120 250 L1200 310
           L1200 320 L0 320 Z" fill="#0a0405"/>

  <!-- Ground -->
  <rect y="310" width="1200" height="190" fill="url(#ak-ground)"/>

  <!-- Perspective grid -->
  <g stroke="#F58F00" fill="none" stroke-width="0.8" opacity="0.5">
    <line x1="600" y1="310" x2="-200" y2="500"/>
    <line x1="600" y1="310" x2="-50" y2="500"/>
    <line x1="600" y1="310" x2="100" y2="500"/>
    <line x1="600" y1="310" x2="230" y2="500"/>
    <line x1="600" y1="310" x2="340" y2="500"/>
    <line x1="600" y1="310" x2="430" y2="500"/>
    <line x1="600" y1="310" x2="510" y2="500"/>
    <line x1="600" y1="310" x2="600" y2="500"/>
    <line x1="600" y1="310" x2="690" y2="500"/>
    <line x1="600" y1="310" x2="770" y2="500"/>
    <line x1="600" y1="310" x2="860" y2="500"/>
    <line x1="600" y1="310" x2="970" y2="500"/>
    <line x1="600" y1="310" x2="1100" y2="500"/>
    <line x1="600" y1="310" x2="1250" y2="500"/>
    <line x1="600" y1="310" x2="1400" y2="500"/>
  </g>
  <g stroke="#F58F00" fill="none" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="358" x2="1200" y2="358"/>
    <line x1="0" y1="342" x2="1200" y2="342"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="322" x2="1200" y2="322"/>
    <line x1="0" y1="316" x2="1200" y2="316"/>
  </g>

  <!-- Acoustic guitar silhouette (dreadnought shape), centered, slightly angled -->
  <g fill="#000" transform="translate(600, 380) rotate(-8)">
    <!-- Lower bout (larger) -->
    <ellipse cx="0" cy="10" rx="85" ry="105"/>
    <!-- Upper bout (smaller) with waist -->
    <ellipse cx="0" cy="-90" rx="68" ry="70"/>
    <!-- Neck -->
    <rect x="-10" y="-220" width="20" height="70"/>
    <!-- Nut -->
    <rect x="-14" y="-232" width="28" height="6" rx="1"/>
    <!-- Headstock -->
    <path d="M-18 -280 L18 -280 L22 -232 L-22 -232 Z"/>
    <!-- Tuning pegs -->
    <circle cx="-18" cy="-268" r="3" fill="#F58F00" opacity="0.6"/>
    <circle cx="18" cy="-268" r="3" fill="#F58F00" opacity="0.6"/>
    <circle cx="-18" cy="-255" r="3" fill="#F58F00" opacity="0.6"/>
    <circle cx="18" cy="-255" r="3" fill="#F58F00" opacity="0.6"/>
    <circle cx="-18" cy="-242" r="3" fill="#F58F00" opacity="0.6"/>
    <circle cx="18" cy="-242" r="3" fill="#F58F00" opacity="0.6"/>
    <!-- Sound hole -->
    <circle cx="0" cy="-10" r="24" fill="#1a0f14"/>
    <circle cx="0" cy="-10" r="24" fill="none" stroke="#F58F00" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="-10" r="20" fill="none" stroke="#F58F00" stroke-width="0.5" opacity="0.3"/>
    <!-- Bridge -->
    <rect x="-30" y="35" width="60" height="8" rx="1" fill="#1a0f14"/>
  </g>
</svg>
